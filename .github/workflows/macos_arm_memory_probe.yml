name: macOS arm64 build memory probe

on:
  push:
    branches: [macos-arm-build-memory-probe]

permissions: {}

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.17.1
          use-cache: false
      - name: start memory monitor
        run: |
          nohup bash -c 'while true; do
            echo "[mon $(date -u +%H:%M:%S)] swap: $(sysctl -n vm.swapusage) | $(vm_stat | awk "/occupied by compressor|Swapouts/ {gsub(/\./,\"\",\$NF); printf \"%s=%s \", \$(NF-1), \$NF}")| load $(sysctl -n vm.loadavg)"
            sleep 60
          done' > "$RUNNER_TEMP/mon.log" 2>&1 &
      - name: build roc + release test binaries
        run: zig build -j1 roc build-test-zig -Dfuzz -Dsystem-afl=false -Doptimize=ReleaseFast --summary all
      - name: roc executable minimal check
        run: ./zig-out/bin/roc check ./CONTRIBUTING/profiling/bench_repeated_check.roc
      - name: execute tests in release mode
        run: zig build -j1 run-test-zig -Doptimize=ReleaseFast -Dfuzz -Dsystem-afl=false
      - name: memory monitor log
        if: always()
        run: cat "$RUNNER_TEMP/mon.log"
