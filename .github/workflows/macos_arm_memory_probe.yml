name: macOS arm64 build memory probe

on:
  push:
    branches: [macos-arm-build-memory-probe]

permissions: {}

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            jobs_flag: ''
            timeout: 150
          - os: macos-15
            jobs_flag: -j1
            timeout: 360
          - os: macos-15
            jobs_flag: -j2
            timeout: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.17.1
          use-cache: false
      - name: machine
        run: |
          sysctl hw.memsize hw.ncpu hw.physicalcpu machdep.cpu.brand_string vm.swapusage || true
          df -h /
          vm_stat
      - name: build roc + release test binaries with memory monitor
        run: |
          monitor() {
            while true; do
              ts=$(date -u +%H:%M:%S)
              swap=$(sysctl -n vm.swapusage)
              vs=$(vm_stat | awk '/Pages free|Pages active|Pages inactive|Pages wired|occupied by compressor|Swapins|Swapouts|Pageouts|Pageins/ {gsub(/\./,"",$NF); printf "%s=%s ", $(NF-1), $NF}')
              load=$(sysctl -n vm.loadavg)
              procs=$(ps -axo rss=,comm= | sort -rn | head -4 | awk '{printf "%dM:%s ", $1/1024, $2}')
              disk=$(df -h / | awk 'NR==2 {print $4}')
              echo "[mon $ts] swap: $swap | $vs| load $load | free disk $disk | top: $procs"
              sleep 60
            done
          }
          monitor &
          zig build ${{ matrix.jobs_flag }} roc build-test-zig -Dfuzz -Dsystem-afl=false -Doptimize=ReleaseFast --summary all 2>&1
