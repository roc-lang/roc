on:
  workflow_call:
    inputs:
      full-run:
        type: boolean
        default: false
        description: Run everything unconditionally (nightly gate); bypasses path filters.
  workflow_dispatch:
    inputs:
      full-run:
        type: boolean
        default: false
        description: Run everything unconditionally (nightly gate); bypasses path filters.

name: Core Compiler CI

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  # Nightly-only Linux checks. Everything that PR CI already runs (the
  # `zig build minici` phases, the static-checks job, and the checks promoted
  # to PRs: `-Dno-bin -Dfuzz -Dtracy`, run-test-repl-wasm, run-test-echo-wasm)
  # is deliberately NOT repeated here; this job keeps only work PR CI does not
  # do.
  check-once:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.16.0
          use-cache: false

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # Zig stores fetched packages in the `p/` subdir of the global cache.
          # Caching just that under a stable build.zig.zon-hash key keeps deps
          # present across runs: it is read every run, so it stays warm and is
          # not evicted by the setup action's churnier per-run cache. A cold runner then no
          # longer re-downloads deps from GitHub and hits HttpConnectionClosing,
          #
          # Note this step is currently the ONLY working cache. The setup
          # action also caches build artifacts, but `.zig-cache` exceeds its
          # 2048 MiB cache-size-limit on every platform, so the action clears
          # the directory in its post step and saves nothing -- every run then
          # starts from a cold build cache. See the "Report .zig-cache
          # composition" step in ci_manager.yml; sizing the limit is a
          # follow-up.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Run fuzz seed reproducers
        env:
          ROC_FUZZ_SEED: ${{ github.sha }}
        run: |
          set -euo pipefail

          for target in tokenize parse canonicalize typecheck build; do
            export ROC_FUZZ_TARGET="$target"
            export ROC_FUZZ_INPUT="/tmp/roc-${target}-fuzz-input"

            python3 - <<'PY'
          import base64
          import hashlib
          import os
          import pathlib

          seed = os.environ["ROC_FUZZ_SEED"]
          target = os.environ["ROC_FUZZ_TARGET"]
          data = bytearray()
          for index in range(8):
              data.extend(hashlib.sha256(f"{seed}:{target}:{index}".encode()).digest())

          path = pathlib.Path(os.environ["ROC_FUZZ_INPUT"])
          path.write_bytes(data)

          print(f"{target} fuzz seed: {seed}")
          print(f"{target} fuzz input base64: {base64.b64encode(data).decode()}")
          PY

            zig build "run-repro-${target}" -- "$ROC_FUZZ_INPUT"
          done

  # Full LLVM-backend end-to-end coverage lives here, on every OS: eval parity
  # tests and the platforms suite built with roc build --opt=size/speed (linked
  # by the embedded lld and executed, with the fx host's leak detection). The
  # strJoinWithC &strDecref leak was an lld-COFF misresolution that only this
  # pipeline can catch. (The dylib/archive build-and-run fixtures run in PR
  # MiniCI.)
  eval-llvm:
    needs: check-once
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.16.0
          use-cache: false

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # Zig stores fetched packages in the `p/` subdir of the global cache.
          # Caching just that under a stable build.zig.zon-hash key keeps deps
          # present across runs: it is read every run, so it stays warm and is
          # not evicted by the setup action's churnier per-run cache. A cold runner then no
          # longer re-downloads deps from GitHub and hits HttpConnectionClosing,
          #
          # Note this step is currently the ONLY working cache. The setup
          # action also caches build artifacts, but `.zig-cache` exceeds its
          # 2048 MiB cache-size-limit on every platform, so the action clears
          # the directory in its post step and saves nothing -- every run then
          # starts from a cold build cache. See the "Report .zig-cache
          # composition" step in ci_manager.yml; sizing the limit is a
          # follow-up.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      # The embedded lld-link resolves /defaultlib via the LIB env and roc's
      # linker locates the Windows SDK/MSVC libpaths at runtime.
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # ratchet:TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Run eval tests with LLVM backend
        if: runner.os != 'Windows'
        uses: ./.github/actions/flaky-retry
        with:
          command: zig build run-test-eval -- --llvm
          retry_count: 3

      # Windows has no fork(), so the runner spawns a fresh worker process per
      # test that compiles the whole program (front-end + LIR lowering) before
      # running any backend. The TRMC/TCE "stack gate" stress tests have a
      # multi-second lowering cost (measured ~9-17s locally; backend eval itself
      # is sub-millisecond) that, on the slower hosted Windows runner under
      # full-suite concurrency, overruns the 30s default per-test timeout and is
      # killed as a HANG. POSIX uses fork-based per-backend isolation on faster
      # runners where 30s is plenty. Give Windows a larger hang budget.
      - name: Run eval tests with LLVM backend (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/flaky-retry
        with:
          command: zig build run-test-eval -- --llvm --timeout 120000
          retry_count: 3

      - name: Run CLI platform tests (LLVM size/speed backends)
        run: zig build run-test-cli -- --include-llvm --filter "[size]" --filter "[speed]"

      # run-test-dylib and run-test-archive are MiniCI phases, so PR CI runs
      # them on these same three OSes; they are not repeated here.

  # `pr_os: true` marks the legs whose OS PR CI (ci_manager.yml MiniCI) also
  # runs. On those legs the Debug suites MiniCI already runs on every PR
  # (run-test-cli, machine-code shim, host-effects, wasm-static-lib) are
  # skipped; the other legs keep them because PR CI never runs those OSes.
  # Everything else here is nightly-only on every leg: the ReleaseFast build
  # and test run, snapshots in `--debug` mode, the full Debug `run-test-zig`
  # aggregate (it includes suites that are not MiniCI phases, e.g.
  # rc-conformance, boxy-abi, module-glue), static-link checks, and kcov.
  zig-tests:
    needs: check-once
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            pr_os: false
            cpu_flag: ''
            target_flag: ''
            release_jobs_flag: ''
            zig_test_timeout_flag: ''
          - os: macos-15
            pr_os: true
            cpu_flag: ''
            target_flag: ''
            release_jobs_flag: ''
            zig_test_timeout_flag: ''
          - os: ubuntu-24.04
            pr_os: true
            cpu_flag: ""
            target_flag: -Dtarget=x86_64-linux-musl
            release_jobs_flag: ''
            zig_test_timeout_flag: ''
          - os: ubuntu-24.04-arm
            pr_os: false
            cpu_flag: ''
            target_flag: ''  # Native build: kcov coverage only runs on arm64 Linux (see Parser Code Coverage below)
            release_jobs_flag: -j2  # Avoid hosted ARM runner disconnects under ReleaseFast parallelism.
            zig_test_timeout_flag: ''
          - os: windows-2022
            pr_os: false
            cpu_flag: ''
            target_flag: ''
            release_jobs_flag: ''
            zig_test_timeout_flag: --test-timeout 5m
          - os: windows-2025
            pr_os: true
            cpu_flag: ''
            target_flag: ''
            release_jobs_flag: ''
            zig_test_timeout_flag: --test-timeout 5m

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.16.0
          use-cache: false

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      # The RustGlue glue-runtime contract case compiles a `#![no_std]` host
      # with `rustc --target <arch>-unknown-linux-musl --crate-type staticlib`,
      # which needs that target's precompiled `core`. Install the native musl
      # target per runner arch (x64 and arm64 Linux both run run-test-cli here).
      - name: Install Rust musl target (Linux)
        if: runner.os == 'Linux'
        run: rustup target add ${{ runner.arch == 'ARM64' && 'aarch64-unknown-linux-musl' || 'x86_64-unknown-linux-musl' }}

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # Zig stores fetched packages in the `p/` subdir of the global cache.
          # Caching just that under a stable build.zig.zon-hash key keeps deps
          # present across runs: it is read every run, so it stays warm and is
          # not evicted by the setup action's churnier per-run cache. A cold runner then no
          # longer re-downloads deps from GitHub and hits HttpConnectionClosing,
          #
          # Note this step is currently the ONLY working cache. The setup
          # action also caches build artifacts, but `.zig-cache` exceeds its
          # 2048 MiB cache-size-limit on every platform, so the action clears
          # the directory in its post step and saves nothing -- every run then
          # starts from a cold build cache. See the "Report .zig-cache
          # composition" step in ci_manager.yml; sizing the limit is a
          # follow-up.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-
      # temp fix, see https://roc.zulipchat.com/#narrow/channel/395097-compiler-development/topic/CI/near/542085291
      - name: delete llvm-config
        if: startsWith(matrix.os, 'ubuntu') && endsWith(matrix.os, '-arm')
        run: |
          sudo rm /usr/lib/llvm-18/bin/llvm-config

      - name: build roc + repro executables
        uses: ./.github/actions/flaky-retry
        with:
          command: zig build ${{ matrix.release_jobs_flag }} -Dfuzz -Dsystem-afl=false -Doptimize=ReleaseFast ${{ matrix.cpu_flag }} ${{ matrix.target_flag }}
          retry_count: 3

      - name: Run Test Platforms (Unix)
        if: runner.os != 'Windows' && !matrix.pr_os
        run: zig build run-test-cli ${{ matrix.target_flag }}

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # ratchet:TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}

      - name: Run Test Platforms (Windows)
        if: runner.os == 'Windows' && !matrix.pr_os
        run: |
          zig build run-test-cli

      - name: Run machine-code shim tests
        if: ${{ !matrix.pr_os }}
        run: zig build run-test-zig-machine-code-shim

      - name: Run host-effects eval tests
        if: ${{ !matrix.pr_os }}
        run: zig build run-test-eval-host-effects

      - name: Run WASM static library tests
        if: ${{ !matrix.pr_os }}
        run: zig build run-test-wasm-static-lib

      - name: roc executable minimal check (Unix)
        if: runner.os != 'Windows'
        run: |
          ./zig-out/bin/roc check ./CONTRIBUTING/profiling/bench_repeated_check.roc

      - name: roc executable minimal check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          zig-out\bin\roc.exe check ./CONTRIBUTING/profiling/bench_repeated_check.roc

      - name: zig snapshot tests
        run: zig build run-check-snapshots ${{ matrix.target_flag }} -- --debug

      # 1) in debug mode
      - name: build and execute tests, build repro executables
        run: zig build ${{ matrix.zig_test_timeout_flag }} run-test-zig -Dfuzz -Dsystem-afl=false ${{ matrix.target_flag }}

      # The full 1,700+ case sweep is deliberately a daily full-suite gate,
      # not a PR MiniCI phase. Debug-only: release builds never materialize
      # the Lambda Mono tree.
      - name: Lambda Mono body-lowering differential harness
        if: inputs.full-run && matrix.os == 'ubuntu-24.04'
        run: zig build run-test-lambda-mono-differential ${{ matrix.target_flag }}

      # 2) in release mode
      - name: Build and execute tests, build repro executables. All in release mode.
        run: zig build ${{ matrix.release_jobs_flag }} ${{ matrix.zig_test_timeout_flag }} run-test-zig -Doptimize=ReleaseFast -Dfuzz -Dsystem-afl=false ${{ matrix.cpu_flag }} ${{ matrix.target_flag }}

      - name: Check for snapshot changes
        run: |
          git diff --exit-code test/snapshots

      - name: check if statically linked (ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          file ./zig-out/bin/roc | grep "statically linked"

      - name: check if statically linked (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          otool_out="$(otool -L ./zig-out/bin/roc)"
          echo "$otool_out"
          # Roc must only depend on libraries that ship with every macOS install, so it
          # stays trivial to install. FSEvents-based file watching links CoreFoundation
          # and CoreServices (which pull in libobjc); all of these are part of the OS.
          unexpected="$(echo "$otool_out" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/libSystem\.B\.dylib|/usr/lib/libobjc\.A\.dylib|/System/Library/Frameworks/CoreFoundation\.framework/|/System/Library/Frameworks/CoreServices\.framework/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Looks like you added a new dynamic dependency to the Roc executable, we want Roc to be super easy to install, so it should only depend on libraries that ship with macOS."
            echo "Unexpected dependencies:"
            echo "$unexpected"
            exit 1
          fi

      - name: check if statically linked (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $imports = (Get-Command zig-out\bin\roc.exe).FileVersionInfo.ImportCharacterSet
          if ($imports) {
              echo "Looks like the executable has dynamic dependencies. We want Roc to be super easy to install, so it should be statically linked."
              echo "Dynamic dependencies found:"
              $imports | ForEach-Object { echo "  $_" }
              exit 1
          }

      # Parser code coverage - run on ARM64 Linux (native build).
      # x86_64 coverage stays disabled: Zig's x86_64 backend emitted .debug_line
      # sections that libdw could not parse (observed on Zig 0.15.2). That has
      # not been re-verified on the current Zig (0.16.0); enabling x86_64
      # coverage needs that re-check first (see build.zig's coverage notes).
      - name: Install kcov dependencies
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev libcurl4-openssl-dev

      - name: Parser Code Coverage
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          # Build kcov and the test binary via the coverage step
          # (coverage step runs kcov and generates the report)
          zig build run-coverage-parser

          echo "=== Coverage summary ==="
          jq '{total: .total_lines, covered: .covered_lines, percent: .percent_covered}' kcov-output/parser/parse_unit_coverage/coverage.json

          echo "=== Files found ==="
          jq -r '.files[].file' kcov-output/parser/parse_unit_coverage/coverage.json | head -10

      - name: Eval Code Coverage
        if: matrix.os == 'ubuntu-24.04-arm'
        run: zig build run-coverage-eval

  zig-valgrind:
    needs: check-once
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.16.0
          use-cache: false

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # Zig stores fetched packages in the `p/` subdir of the global cache.
          # Caching just that under a stable build.zig.zon-hash key keeps deps
          # present across runs: it is read every run, so it stays warm and is
          # not evicted by the setup action's churnier per-run cache. A cold runner then no
          # longer re-downloads deps from GitHub and hits HttpConnectionClosing,
          #
          # Note this step is currently the ONLY working cache. The setup
          # action also caches build artifacts, but `.zig-cache` exceeds its
          # 2048 MiB cache-size-limit on every platform, so the action clears
          # the directory in its post step and saves nothing -- every run then
          # starts from a cold build cache. See the "Report .zig-cache
          # composition" step in ci_manager.yml; sizing the limit is a
          # follow-up.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: build roc + repro executables for valgrind
        uses: ./.github/actions/flaky-retry
        with:
          # `-e .zig-cache` is load-bearing: `git clean -x` removes ignored
          # files, so without it this deletes the `p/` package dir that the
          # cache step above restored one step earlier -- forcing a full
          # re-download of every dependency and producing exactly the
          # HttpConnectionClosing flake that this flaky-retry wrapper then
          # absorbs. Keeping the rest of `.zig-cache` is safe: Zig keys cache
          # entries on the full build configuration, so the valgrind build
          # (-Dvalgrind=true, musl target, ReleaseFast) hashes to different
          # entries than any other job's and cannot pick up stale artifacts.
          # Keep large ReleaseFast Zig compiler processes from overlapping and
          # exhausting the hosted runner's memory. This lane builds several
          # artifacts that individually peak at multiple GiB under valgrind.
          command: git clean -fdx -e .zig-cache && zig build -j1 -Dvalgrind=true -Dfuzz -Dsystem-afl=false -Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl -Dstrip=false -Dshared-memory-size=268435456
          retry_count: 3

      - name: install valgrind
        run: |
          # Install libc6-dbg which is required for Valgrind's function redirections
          sudo apt-get update && sudo apt-get install -y libc6-dbg
          sudo snap install valgrind --classic
          valgrind --version

      - name: valgrind platform apps
        run: |
          ./ci/custom_valgrind.sh ./zig-out/bin/roc --no-cache test/str/app.roc
          ./ci/custom_valgrind.sh ./zig-out/bin/roc --no-cache test/int/app.roc

      - name: valgrind snapshots
        run: |
          ./ci/valgrind_snapshots.sh

  zig-cross-compile:
    needs: check-once
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-musl
          - aarch64-macos-none
          - arm-linux-musleabihf
          - x86-linux-musl
          - x86_64-macos-none
          - x86_64-windows-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.16.0
          use-cache: false

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # Zig stores fetched packages in the `p/` subdir of the global cache.
          # Caching just that under a stable build.zig.zon-hash key keeps deps
          # present across runs: it is read every run, so it stays warm and is
          # not evicted by the setup action's churnier per-run cache. A cold runner then no
          # longer re-downloads deps from GitHub and hits HttpConnectionClosing,
          #
          # Note this step is currently the ONLY working cache. The setup
          # action also caches build artifacts, but `.zig-cache` exceeds its
          # 2048 MiB cache-size-limit on every platform, so the action clears
          # the directory in its post step and saves nothing -- every run then
          # starts from a cold build cache. See the "Report .zig-cache
          # composition" step in ci_manager.yml; sizing the limit is a
          # follow-up.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: cross compile with llvm
        uses: ./.github/actions/flaky-retry
        with:
          command: zig build -Dtarget=${{ matrix.target }}
          retry_count: 3

  # aarch64 Linux smoke test of the shipped binary shape (moved here from PR
  # CI, where it cost ~23 min per push and only ever failed alongside the other
  # legs' build failures). Deliberately a single release binary plus one host
  # lib: hosted arm64 runners lose network mid-`build-ci` at full parallelism,
  # so a full MiniCI shard is not viable on them.
  arm64-linux-hello-world:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.16.0
          use-cache: false

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # Zig stores fetched packages in the `p/` subdir of the global cache.
          # Caching just that under a stable build.zig.zon-hash key keeps deps
          # present across runs: it is read every run, so it stays warm and is
          # not evicted by the setup action's churnier per-run cache. A cold runner then no
          # longer re-downloads deps from GitHub and hits HttpConnectionClosing.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      # temp fix, see https://roc.zulipchat.com/#narrow/channel/395097-compiler-development/topic/CI/near/542085291
      # `-f` because the LLVM version on the runner image is not this job's to
      # depend on; there being no llvm-config to remove is fine.
      - name: delete llvm-config
        run: sudo rm -f /usr/lib/llvm-18/bin/llvm-config

      # `build-release` rather than a plain `zig build`, so this runs the binary
      # shape that ships: musl, and pinned to the aarch64 baseline CPU by
      # getReleaseTargetQuery. That pin is precisely why the compiler cannot
      # read its own CPU features out of `builtin.cpu` and has to ask the
      # machine at runtime.
      - name: build release roc
        uses: ./.github/actions/flaky-retry
        with:
          command: zig build build-release
          retry_count: 3

      # The fx platform ships `crt1.o` and `libc.a` for each target but builds
      # `libhost.a`, so the arm64musl inputs dir is incomplete until this runs.
      - name: build the fx platform host
        uses: ./.github/actions/flaky-retry
        with:
          command: zig build build-test-hosts -Dplatform=fx
          retry_count: 3

      - name: Test native instruction-cache publication
        run: zig test src/machine_code_shim/instruction_cache.zig -O ReleaseSafe

      - name: run hello_world.roc
        run: |
          set -euo pipefail

          output="$(./zig-out/bin/roc test/fx/hello_world.roc)"
          echo "$output"

          if [ "$output" != "Hello, world!" ]; then
            echo "Expected 'Hello, world!' but got '$output'."
            exit 1
          fi

  # Test cross-compilation with Roc's cross-compilation system (musl + glibc)
  roc-cross-compile:
    uses: ./.github/workflows/ci_cross_compile.yml

  # Check if nix-related files changed. On full runs (nightly gate) the
  # paths-filter is bypassed: dorny/paths-filter cannot run on schedule
  # events (no diff base), and the gate must build nix unconditionally.
  check-nix-changes:
    runs-on: ubuntu-24.04
    outputs:
      nix: ${{ inputs.full-run || steps.filter.outputs.nix == 'true' }}
    steps:
      - if: ${{ !inputs.full-run }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - if: ${{ !inputs.full-run }}
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # ratchet:dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            nix:
              - 'build.zig'
              - 'build.zig.zon'
              - 'flake.lock'
              - '**/*.nix'

  # Test building inside nix environment
  nix-build:
    needs: [check-once, check-nix-changes]
    if: needs.check-nix-changes.outputs.nix == 'true'
    uses: ./.github/workflows/ci_zig_nix.yml
