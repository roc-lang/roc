on:
  workflow_call:

# Do not add permissions here! Configure them at the job level!
permissions: {}

name: Perf

# Compares the release roc of a PR ("head", built from the merge commit) with
# that of its base (the merge commit's first parent) on Linux, macOS and
# Windows, by running ci/perf/bench.roc. ci_manager.yml calls this after its
# `bsd-build-hello-world` job, which builds the Linux head binary.
#
#   perf-build (5 legs) ─> perf-screen (linux, macos, windows) ─> perf-triage
#     ─> perf-confirm (only the OSes with flagged benchmarks) ─> perf-report
#
# Every binary is built on Linux, the macOS and Windows ones by
# cross-compiling, so the scarce runners only benchmark. Screening flags a
# benchmark when the whole confidence interval of its median head/base time
# ratio is above the threshold. A fresh runner of the same OS then re-measures
# it, and the check fails only if that confirms the regression.
#
# bench.roc runs on the Roc nightly pinned in its header, never on the roc
# being measured.

jobs:
  perf-build:
    name: perf-build (${{ matrix.side }} ${{ matrix.os }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux head binary comes from `bsd-build-hello-world`.
          - side: base
            os: linux
            target: ''
          - side: base
            os: macos
            target: -Dtarget=aarch64-macos-none
          - side: head
            os: macos
            target: -Dtarget=aarch64-macos-none
          - side: base
            os: windows
            target: -Dtarget=x86_64-windows-gnu
          - side: head
            os: windows
            target: -Dtarget=x86_64-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      # The base is the merge commit's first parent: the tip of the target
      # branch that GitHub merged this PR into. It is built in its own worktree
      # so the workflow keeps using this commit's local actions.
      - name: Check out the base
        if: matrix.side == 'base'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          git -C "$RUNNER_TEMP/base" log -1 --oneline
          echo "BUILD_DIR=$RUNNER_TEMP/base" >> "$GITHUB_ENV"

      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.17.1
          use-cache: false

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # See the same step in `minici-build-linux` in ci_manager.yml.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: build release roc
        uses: ./.github/actions/flaky-retry
        with:
          command: cd "${BUILD_DIR:-.}" && zig build build-release ${{ matrix.target }}
          retry_count: 3

      - name: Collect roc
        shell: bash
        env:
          EXE: ${{ matrix.os == 'windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          mkdir perf-bin
          cp "${BUILD_DIR:-.}/zig-out/bin/roc$EXE" perf-bin/
          ls -l perf-bin

      - name: Upload roc
        uses: actions/upload-artifact@v7.0.1 # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: roc-${{ matrix.side }}-${{ matrix.os }}
          path: perf-bin
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  perf-screen:
    needs: perf-build
    name: perf-screen (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-26.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Download base roc
        uses: actions/download-artifact@v8.0.1 # ratchet:actions/download-artifact@v8.0.1
        with:
          name: roc-base-${{ matrix.os }}
          path: perf-bin/base

      - name: Download head roc
        uses: actions/download-artifact@v8.0.1 # ratchet:actions/download-artifact@v8.0.1
        with:
          name: roc-head-${{ matrix.os }}
          path: perf-bin/head

      # Artifacts do not keep the executable bit.
      - name: Make roc executable
        if: runner.os != 'Windows'
        run: chmod +x perf-bin/base/roc perf-bin/head/roc

      - name: Set up Roc for bench.roc
        uses: ./.github/actions/setup-bench-roc

      - name: Test the benchmark harness
        if: matrix.os == 'linux'
        run: roc test ci/perf/bench.roc

      - name: Screen
        shell: bash
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          mkdir -p perf-results
          roc ci/perf/bench.roc screen \
            --base "perf-bin/base/roc$EXE" --head "perf-bin/head/roc$EXE" \
            --out "perf-results/screen-$OS.tsv"

      - name: Upload screening results
        uses: actions/upload-artifact@v7.0.1 # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: perf-screen-${{ matrix.os }}
          path: perf-results
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  perf-triage:
    needs: perf-screen
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.triage.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            .github/actions
            ci/perf

      - name: Download screening results
        uses: actions/download-artifact@v8.0.1 # ratchet:actions/download-artifact@v8.0.1
        with:
          pattern: perf-screen-*
          path: perf-results
          merge-multiple: true

      - name: Set up Roc for bench.roc
        uses: ./.github/actions/setup-bench-roc

      - name: Pick the OSes to confirm on
        id: triage
        run: roc ci/perf/bench.roc triage --dir perf-results

  # Re-measures only the flagged benchmarks, on a fresh runner of the same OS
  # and with a fixed number of pairs, and diagnoses what it confirms.
  perf-confirm:
    needs: perf-triage
    if: needs.perf-triage.outputs.matrix != '[]'
    name: perf-confirm (${{ matrix.os }})
    runs-on: ${{ fromJSON('{"linux":"ubuntu-26.04","macos":"macos-15","windows":"windows-2025"}')[matrix.os] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.perf-triage.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Download base roc
        uses: actions/download-artifact@v8.0.1 # ratchet:actions/download-artifact@v8.0.1
        with:
          name: roc-base-${{ matrix.os }}
          path: perf-bin/base

      - name: Download head roc
        uses: actions/download-artifact@v8.0.1 # ratchet:actions/download-artifact@v8.0.1
        with:
          name: roc-head-${{ matrix.os }}
          path: perf-bin/head

      - name: Make roc executable
        if: runner.os != 'Windows'
        run: chmod +x perf-bin/base/roc perf-bin/head/roc

      - name: Set up Roc for bench.roc
        uses: ./.github/actions/setup-bench-roc

      - name: Confirm
        id: confirm
        shell: bash
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
          OS: ${{ matrix.os }}
          BENCHMARKS: ${{ matrix.benchmarks }}
        run: |
          set -euo pipefail
          mkdir -p perf-results
          roc ci/perf/bench.roc confirm \
            --base "perf-bin/base/roc$EXE" --head "perf-bin/head/roc$EXE" \
            --only "$BENCHMARKS" --out "perf-results/confirm-$OS.tsv"

      - name: Install valgrind
        if: matrix.os == 'linux' && steps.confirm.outputs.regressed != ''
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # Informational only, so it never fails the check.
      - name: Diagnose
        if: steps.confirm.outputs.regressed != ''
        continue-on-error: true
        shell: bash
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
          OS: ${{ matrix.os }}
          REGRESSED: ${{ steps.confirm.outputs.regressed }}
        run: |
          set -euo pipefail
          roc ci/perf/bench.roc diagnose \
            --base "perf-bin/base/roc$EXE" --head "perf-bin/head/roc$EXE" \
            --only "$REGRESSED" --out "perf-results/diagnose-$OS.md"

      - name: Upload confirmation results
        uses: actions/upload-artifact@v7.0.1 # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: perf-confirm-${{ matrix.os }}
          path: perf-results
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  perf-report:
    needs: [perf-triage, perf-confirm]
    # perf-confirm is skipped when screening flagged nothing.
    if: >-
      !cancelled() && needs.perf-triage.result == 'success' &&
      (needs.perf-confirm.result == 'success' || needs.perf-confirm.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            .github/actions
            ci/perf

      - name: Download results
        uses: actions/download-artifact@v8.0.1 # ratchet:actions/download-artifact@v8.0.1
        with:
          pattern: perf-*
          path: perf-results
          merge-multiple: true

      - name: Set up Roc for bench.roc
        uses: ./.github/actions/setup-bench-roc

      - name: Report
        run: roc ci/perf/bench.roc report --dir perf-results --summary "$GITHUB_STEP_SUMMARY"
