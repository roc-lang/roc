on:
  pull_request:
    # `ready_for_review` re-runs CI when a draft PR is marked ready, because
    # draft PRs skip the macOS and Windows lanes (see `minici-build-macos`).
    types: [opened, synchronize, reopened, ready_for_review]

# cancel current runs when a new commit is pushed
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

name: CI Manager

# Job graph:
#
#   static-checks ────────────────────────────┐ (gates macOS + Windows)
#   check-changes ─┬─> linux-extra-checks     │
#                  ├─> minici-build-linux ───>│ minici-linux   (5 shards)
#                  ├─> minici-build-macos <───┤ minici-macos   (4 shards)
#                  └─> minici-build-windows <─┘ minici-windows (6 shards)
#   everything above ─> finish (the only required check)
#
# `static-checks` runs on every PR, including docs-only ones. The MiniCI lanes
# run only when `check-changes` finds a file outside the docs-only allowlist.
# Each OS's shards wait only for that OS's build. macOS and Windows are the
# scarce runners, so their lanes also wait for `static-checks` to pass and are
# skipped on draft PRs.
#
# `perf` (ci_perf.yml) compares the PR's release roc with its base's on Linux,
# macOS and Windows and fails on a confirmed slowdown. `perf-build`
# (ci_perf_build.yml) builds the binaries alongside `bsd-build-hello-world`,
# whose Linux release build is the head binary. Like the macOS and Windows
# lanes, both are skipped on draft PRs.
#
# Which MiniCI jobs each shard runs is defined in src/build/minici.zig
# (`shards`); `static-checks` verifies that this file names every shard of
# the pull-request hosts exactly once through the `minici_shard:` matrix keys.
#
# The full suite (LLVM eval, valgrind, cross-compile, nix, the wider OS matrix,
# ...) runs daily on main via nightly_gate.yml.

jobs:
  check-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      # Needed to find the Markdown files that Roc sources import (see below).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      # The MiniCI lanes run unless every changed path is on the docs-only
      # allowlist below. An allowlist of what is safe to skip fails safe: a new
      # code path, script, or config file runs the lanes until someone decides
      # it doesn't need them. Renames count both their old and new paths.
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail

          # Markdown files that Roc sources import (`import "x.md" as x : Str`)
          # are test inputs, not prose: e.g. test/echo/all_syntax_test.roc
          # imports the root README.md. Paths are relative to the repo root.
          # `git grep` exits 1 when nothing matches, which is not an error here.
          consumed_md="$({ git grep -l -E '^[[:space:]]*import "[^"]+\.md"' -- '*.roc' || [ "$?" -eq 1 ]; } |
            while IFS= read -r roc; do
              sed -nE 's/^[[:space:]]*import "([^"]+\.md)".*/\1/p' "$roc" |
                while IFS= read -r rel; do
                  realpath -m --relative-to=. "$(dirname "$roc")/$rel"
                done
            done | sort -u)"
          echo "Markdown imported by Roc sources: ${consumed_md:-none}"

          # Paths whose content no MiniCI lane builds, runs, or reads.
          # `static-checks` (tidy, actionlint, ...) still runs on every PR, so
          # these files are checked there.
          is_docs_only() {
            case "$1" in
              # Snapshot `.md` files are test inputs and expected outputs.
              test/*) return 1 ;;
              # Prose, unless a Roc source imports it. Nothing else embeds or
              # tests Markdown outside test/ (the langref under docs/ is read
              # only by `roc docs --with-lang-ref`, which no test runs).
              *.md) ! grep -Fxq -- "$1" <<< "$consumed_md" ;;
              LICENSE | authors | .reuse | .rules) return 0 ;;
              # Configs read only by alwayscheck.yml / markdown_link_check.yml.
              typos.toml | mlc_config.json) return 0 ;;
              # Workflow files no MiniCI lane runs; actionlint in
              # `static-checks` validates them.
              .github/workflows/alwayscheck.yml | .github/workflows/markdown_link_check.yml | \
              .github/workflows/nightly_gate.yml | .github/workflows/ci_zig.yml | \
              .github/workflows/ci_zig_nix.yml | .github/workflows/ci_cross_compile.yml | \
              .github/workflows/stale.yml | .github/workflows/zulip_bot_high_p_issues.yml | \
              .github/dependabot.yml | \
              .github/FUNDING.yml | .github/actionlint.yaml) return 0 ;;
              *) return 1 ;;
            esac
          }

          paths="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          listed="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' | wc -l)"

          heavy=false
          # The files API lists at most 3000 files. A PR whose listing is short
          # of its changed-file count cannot be proven docs-only.
          if [ "$listed" -lt "$CHANGED_FILES" ]; then
            echo "Listed $listed of $CHANGED_FILES changed files; running the MiniCI lanes."
            heavy=true
          fi

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if ! is_docs_only "$path"; then
              echo "needs MiniCI: $path"
              heavy=true
            fi
          done <<< "$paths"

          echo "heavy=$heavy"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  # Checks that read only tracked sources run here instead of on every OS:
  # their result should not depend on the host. They are quick, so they gate
  # the scarce macOS and Windows runners. The Windows shards run them again,
  # with every other MiniCI job, because Windows paths and tools have broken
  # them there alone (see `Lane.all` in src/build/minici.zig).
  static-checks:
    name: static-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        # A one-entry matrix so the source shard is named through the same
        # `minici_shard:` key as every other shard (see the verify step).
        include:
          - minici_shard: source
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Check no tracked plan.md files
        shell: bash
        run: |
          set -euo pipefail

          matches="$(git ls-files -- ':(glob)**/plan.md')"
          if [ -n "$matches" ]; then
            echo "Tracked plan.md files are not allowed:"
            echo "$matches"
            exit 1
          fi

      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.17.1
          use-cache: false

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # See the same step in .github/actions/minici-build.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      # The source lane runs every source check and reports all failures,
      # rather than stopping at the first one.
      - name: Run MiniCI source checks
        run: zig build minici -- --minici-shard ${{ matrix.minici_shard }}

      # Each step below also runs when an earlier one failed, so one push
      # reports every static problem.
      - name: Check the CI files run MiniCI as declared
        if: ${{ !cancelled() }}
        run: zig build minici -- --minici-verify-workflows

      - name: Test documentation search
        if: ${{ !cancelled() }}
        run: node --test test/docs-search/search.test.cjs

      # Not a MiniCI job; covers ci/tidy.zig itself.
      - name: Run tidy unit tests
        if: ${{ !cancelled() }}
        run: zig build run-test-zig-tidy-unit

      # Not a MiniCI job; covers ci/restamp_zig_cache.zig itself.
      - name: Run Zig cache re-stamping unit tests
        if: ${{ !cancelled() }}
        run: zig build run-test-zig-restamp-zig-cache

      # Uses real generated compiler options and an empty dependency bundle;
      # no Roc CLI compilation or published LLVM bundle is needed.
      - name: Check compiler artifact identities
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 ci/test_compiler_artifact_identity.py zig \
            --work-dir "$RUNNER_TEMP/roc-compiler-artifact-identity"

      # Two std-only test producers exercise report isolation and dynamic
      # filtering without compiling Roc or linking a dependency bundle.
      - name: Check independent unit-test reports
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/roc-test-report-deps/include" "$RUNNER_TEMP/roc-test-report-deps/lib"
          python3 ci/test_unit_report_isolation.py zig \
            --work-dir "$RUNNER_TEMP/roc-test-reports" -- \
            "-Droc-deps-path=$RUNNER_TEMP/roc-test-report-deps" \
            -j2 --cache-poison=disallowed

      # Exercises the production display-version reader in source archives,
      # ordinary checkouts and worktrees without compiling Roc.
      - name: Check cached Git display metadata
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 ci/test_build_version_metadata.py zig \
            --work-dir "$RUNNER_TEMP/roc-git-display-metadata" -- -j2

      - name: Install actionlint
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      # Lints every workflow, running shellcheck (preinstalled on the image)
      # over `run:` scripts, with the repo's .github/actionlint.yaml.
      - name: Lint GitHub Actions workflows
        if: ${{ !cancelled() }}
        shell: bash
        run: '"$RUNNER_TEMP/actionlint" -color'

  # Keeps the fuzz and Tracy build configurations compiling on every PR (this
  # used to run only nightly). Kept out of `static-checks` because it analyses
  # the whole compiler, which would delay the macOS and Windows lanes that wait
  # on `static-checks`. The 32-bit `-Dno-bin` checks stay nightly-only
  # (ci_zig.yml `zig-cross-compile`): analysing `roc` for a 32-bit target peaks
  # around 15 GB, too close to a standard runner's 16 GB to gate PRs on.
  linux-extra-checks:
    needs: check-changes
    if: needs.check-changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Enlarge swap (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/enlarge-linux-swap

      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.17.1
          use-cache: false

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # See the same step in .github/actions/minici-build.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Checkout Tracy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          path: tracy
          repository: wolfpld/tracy
          ref: v0.11.0

      # Keeps the fuzz and Tracy build configurations compiling.
      - name: Check the fuzz and Tracy configurations
        run: zig build -Dno-bin -Dfuzz -Dtracy=./tracy

  # One build job per OS, so each OS's shards need only that OS's build and a
  # slow or queued runner on one OS never delays another OS's tests. The three
  # build jobs share one step list (`&minici_build_steps`), whose work is the
  # `minici-build` action that ci_zig.yml's nightly hosts run too; OS
  # differences are `if:` conditions on its steps.
  minici-build-linux:
    needs: check-changes
    if: needs.check-changes.outputs.heavy == 'true'
    name: minici-build (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The `Host` in src/build/minici.zig whose shards this build serves; the
    # `minici-build` action packs one artifact for each of them.
    env:
      MINICI_HOST: linux
    steps: &minici_build_steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - uses: ./.github/actions/minici-build

  minici-build-macos:
    # macOS and Windows runners are the scarce ones: their lanes wait for the
    # quick `static-checks` to pass and are skipped on draft PRs
    # (`ready_for_review` re-runs CI when the PR is marked ready).
    needs: [check-changes, static-checks]
    if: needs.check-changes.outputs.heavy == 'true' && !github.event.pull_request.draft
    name: minici-build (macos-15)
    runs-on: macos-15
    # The Zig 0.17 build takes about 110 to 120 minutes here, so 120 leaves no
    # margin.
    timeout-minutes: 180
    env:
      MINICI_HOST: macos
    steps: *minici_build_steps

  minici-build-windows:
    # See `minici-build-macos`.
    needs: [check-changes, static-checks]
    if: needs.check-changes.outputs.heavy == 'true' && !github.event.pull_request.draft
    name: minici-build (windows-2025)
    runs-on: windows-2025
    # The Zig 0.17 build takes about 110 to 120 minutes here (the eval runner
    # alone about 35), so 120 leaves no margin; windows-eval has the same headroom.
    timeout-minutes: 180
    env:
      MINICI_HOST: windows
    steps: *minici_build_steps

  # Each shard runs the MiniCI jobs that src/build/minici.zig assigns to its
  # `minici_shard`. The three OS shard jobs share one step list
  # (`&minici_shard_steps`), whose work is the `minici-shard` action that
  # ci_zig.yml's nightly hosts run too. Every check and test a shard runs is a MiniCI job,
  # so MiniCI measures what each one compiled; the one per-shard extra is a
  # matrix flag:
  #   valgrind         - install Valgrind (for run-check-str-eq-same-allocation)
  minici-linux:
    needs: [check-changes, minici-build-linux]
    if: needs.check-changes.outputs.heavy == 'true'
    name: minici (${{ matrix.minici_shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - minici_shard: linux-core
            valgrind: true
          - minici_shard: linux-eval
            valgrind: false
          - minici_shard: linux-simd
            valgrind: false
          - minici_shard: linux-harness
            valgrind: false
          - minici_shard: linux-strategy
            valgrind: false
    steps: &minici_shard_steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - uses: ./.github/actions/minici-shard
        with:
          shard: ${{ matrix.minici_shard }}
          valgrind: ${{ matrix.valgrind }}

  minici-macos:
    needs: [check-changes, minici-build-macos]
    if: needs.check-changes.outputs.heavy == 'true'
    name: minici (${{ matrix.minici_shard }})
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - minici_shard: macos-core
            valgrind: false
          - minici_shard: macos-eval
            valgrind: false
          - minici_shard: macos-harness
            valgrind: false
          - minici_shard: macos-strategy
            valgrind: false
    steps: *minici_shard_steps

  # Unlike macOS, Windows runs every MiniCI job, the source and primary-host
  # ones included, so `zig build minici` stays green on Windows machines.
  minici-windows:
    needs: [check-changes, minici-build-windows]
    if: needs.check-changes.outputs.heavy == 'true'
    name: minici (${{ matrix.minici_shard }})
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - minici_shard: windows-core
            valgrind: false
          - minici_shard: windows-zig
            valgrind: false
          - minici_shard: windows-eval
            valgrind: false
          - minici_shard: windows-simd
            valgrind: false
          - minici_shard: windows-harness
            valgrind: false
          - minici_shard: windows-strategy
            valgrind: false
    steps: *minici_shard_steps

  # aarch64 Linux smoke test of the shipped binary shape. Deliberately a single
  # release binary plus one host lib: hosted arm64 runners lose network
  # mid-`build-ci` at full parallelism, so a full MiniCI shard is not viable
  # on them.
  arm64-linux-hello-world:
    needs: check-changes
    if: needs.check-changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Enlarge swap (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/enlarge-linux-swap

      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.17.1
          use-cache: false

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # Zig stores fetched packages in the `p/` subdir of the global cache.
          # Caching just that under a stable build.zig.zon-hash key keeps deps
          # present across runs: it is read every run, so it stays warm and is
          # not evicted by the setup action's churnier per-run cache. A cold runner then no
          # longer re-downloads deps from GitHub and hits HttpConnectionClosing.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      # temp fix, see https://roc.zulipchat.com/#narrow/channel/395097-compiler-development/topic/CI/near/542085291
      # `-f` because the LLVM version on the runner image is not this job's to
      # depend on; there being no llvm-config to remove is fine.
      - name: delete llvm-config
        run: sudo rm -f /usr/lib/llvm-18/bin/llvm-config

      # `build-release` rather than a plain `zig build`, so this runs the binary
      # shape that ships: musl, and pinned to the aarch64 baseline CPU by
      # getReleaseTargetQuery. That pin is precisely why the compiler cannot
      # read its own CPU features out of `builtin.cpu` and has to ask the
      # machine at runtime.
      - name: build release roc
        uses: ./.github/actions/flaky-retry
        with:
          command: zig build build-release
          retry_count: 3

      # The fx platform ships `crt1.o` and `libc.a` for each target but builds
      # `libhost.a`, so the arm64musl inputs dir is incomplete until this runs.
      - name: build the fx platform host
        uses: ./.github/actions/flaky-retry
        with:
          command: zig build update-test-fixtures -Dplatform=fx
          retry_count: 3

      - name: Test native instruction-cache publication
        run: zig test src/backend/dev/instruction_cache.zig -O ReleaseSafe

      - name: Test foreground app interrupts
        run: python3 ci/test_run_sigint.py ./zig-out/bin/roc

      - name: run hello_world.roc
        run: |
          set -euo pipefail

          output="$(./zig-out/bin/roc test/fx/hello_world.roc)"
          echo "$output"

          if [ "$output" != "Hello, world!" ]; then
            echo "Expected 'Hello, world!' but got '$output'."
            exit 1
          fi

  # roc itself cannot be built on the BSDs (roc-bootstrap ships no LLVM for
  # them), so the BSD smoke test cross-compiles the builtin platform's hello
  # world on Linux and runs the executables inside BSD VMs below. OpenBSD is
  # absent because the builtin platform cannot cross-link it.
  #
  # The release roc it builds is also the Linux head binary of `perf`.
  bsd-build-hello-world:
    needs: check-changes
    if: needs.check-changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Enlarge swap (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/enlarge-linux-swap

      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.17.1
          use-cache: false

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # See the same step in .github/actions/minici-build.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: build release roc
        uses: ./.github/actions/flaky-retry
        with:
          command: zig build build-release
          retry_count: 3

      - name: cross-compile hello world
        run: |
          set -euo pipefail

          mkdir bsd-hello-world
          for target in x64freebsd x64netbsd; do
            ./zig-out/bin/roc build --opt=speed --no-cache \
              --target="$target" --output="bsd-hello-world/hello_$target" \
              test/echo/hello.roc
          done

      - name: Upload BSD executables
        uses: actions/upload-artifact@v7.0.1 # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: bsd-hello-world
          path: bsd-hello-world
          if-no-files-found: error
          retention-days: 1

      - name: Upload release roc for perf
        uses: actions/upload-artifact@v7.0.1 # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: roc-head-linux
          path: zig-out/bin/roc
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Builds the release roc binaries `perf` compares, except the Linux head one
  # from `bsd-build-hello-world`. See ci_perf_build.yml.
  perf-build:
    needs: check-changes
    if: needs.check-changes.outputs.heavy == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/ci_perf_build.yml

  # Fails on a slowdown of the PR's release roc that a second runner confirms.
  # See ci_perf.yml.
  perf:
    needs: [check-changes, bsd-build-hello-world, perf-build]
    if: needs.check-changes.outputs.heavy == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/ci_perf.yml

  # Runs on a Linux runner, where bsd-action boots the VM under QEMU. The
  # `cpa.sh` shell runs a step inside the VM.
  bsd-hello-world:
    needs: bsd-build-hello-world
    name: bsd-hello-world (${{ matrix.os }} ${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '15.1'
            target: x64freebsd
          - os: netbsd
            version: '11.0'
            target: x64netbsd
    steps:
      - name: Download BSD executables
        uses: actions/download-artifact@v8.0.1 # ratchet:actions/download-artifact@v8.0.1
        with:
          name: bsd-hello-world

      - name: Start ${{ matrix.os }} VM
        uses: Anton-4/bsd-action@210435e2d3ab2393c7cad5c69014330efadd8f39 # master
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}

      - name: run hello world
        shell: cpa.sh {0}
        run: |
          set -eu

          chmod +x ./hello_${{ matrix.target }}
          output="$(./hello_${{ matrix.target }})"
          echo "$output"

          if [ "$output" != "Hello, World!" ]; then
            echo "Expected 'Hello, World!' but got '$output'."
            exit 1
          fi

  finish:
    needs:
      - check-changes
      - static-checks
      - linux-extra-checks
      - minici-build-linux
      - minici-linux
      - minici-build-macos
      - minici-macos
      - minici-build-windows
      - minici-windows
      - arm64-linux-hello-world
      - bsd-build-hello-world
      - bsd-hello-world
      - perf-build
      - perf
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    steps:
      # Every needed job must end with exactly the expected result, so a
      # cancelled or unexpectedly skipped job fails this check. The macOS and
      # Windows lanes and the perf jobs may be skipped only on a draft PR.
      - name: Check workflow results
        shell: bash
        env:
          CHECK_CHANGES: ${{ needs.check-changes.result }}
          HEAVY: ${{ needs.check-changes.outputs.heavy }}
          DRAFT: ${{ github.event.pull_request.draft }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          LINUX_EXTRA_CHECKS: ${{ needs.linux-extra-checks.result }}
          BUILD_LINUX: ${{ needs.minici-build-linux.result }}
          MINICI_LINUX: ${{ needs.minici-linux.result }}
          BUILD_MACOS: ${{ needs.minici-build-macos.result }}
          MINICI_MACOS: ${{ needs.minici-macos.result }}
          BUILD_WINDOWS: ${{ needs.minici-build-windows.result }}
          MINICI_WINDOWS: ${{ needs.minici-windows.result }}
          ARM64_HELLO_WORLD: ${{ needs.arm64-linux-hello-world.result }}
          BSD_BUILD_HELLO_WORLD: ${{ needs.bsd-build-hello-world.result }}
          BSD_HELLO_WORLD: ${{ needs.bsd-hello-world.result }}
          PERF_BUILD: ${{ needs.perf-build.result }}
          PERF: ${{ needs.perf.result }}
        run: |
          set -euo pipefail
          failed=0
          expect() {
            local job="$1" actual="$2" expected="$3"
            if [ "$actual" = "$expected" ]; then
              echo "$job: $actual"
            else
              echo "::error::$job is '$actual', expected '$expected'."
              failed=1
            fi
          }

          expect check-changes "$CHECK_CHANGES" success
          expect static-checks "$STATIC_CHECKS" success

          if [ "$CHECK_CHANGES" = success ] && [ "$HEAVY" = true ]; then
            expect linux-extra-checks "$LINUX_EXTRA_CHECKS" success
            expect minici-build-linux "$BUILD_LINUX" success
            expect minici-linux "$MINICI_LINUX" success
            expect arm64-linux-hello-world "$ARM64_HELLO_WORLD" success
            expect bsd-build-hello-world "$BSD_BUILD_HELLO_WORLD" success
            expect bsd-hello-world "$BSD_HELLO_WORLD" success

            if [ "$DRAFT" = true ]; then
              scarce=skipped
            else
              scarce=success
            fi
            expect minici-build-macos "$BUILD_MACOS" "$scarce"
            expect minici-macos "$MINICI_MACOS" "$scarce"
            expect minici-build-windows "$BUILD_WINDOWS" "$scarce"
            expect minici-windows "$MINICI_WINDOWS" "$scarce"
            expect perf-build "$PERF_BUILD" "$scarce"
            expect perf "$PERF" "$scarce"
          elif [ "$CHECK_CHANGES" = success ]; then
            echo "Docs-only change: the MiniCI lanes are not required."
          fi

          exit "$failed"
