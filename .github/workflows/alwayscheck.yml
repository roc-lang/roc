on:
  pull_request:

name: SpellCheck

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

# Glossary.md's repository links are checked by `zig build run-check-tidy`
# (ci/tidy.zig), which PR CI runs on every PR.
jobs:
  spellcheck:
    name: Spellcheck
    runs-on: [ubuntu-24.04]
    timeout-minutes: 20
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # The action downloads the prebuilt typos 1.44.0 release binary and runs
      # it over the repo with the implicit typos.toml config.
      - name: do spell check with typos 1.44.0
        uses: crate-ci/typos@631208b7aac2daa8b707f55e7331f9112b0e062d # ratchet:crate-ci/typos@v1.44.0
