name: 'Set up Roc for ci/perf/bench.roc'
description: 'Install the Roc nightly that the `roc:` entry in the header of ci/perf/bench.roc pins.'
runs:
  using: 'composite'
  steps:
    - name: Read the pinned Roc nightly
      id: nightly
      shell: bash
      run: |
        set -euo pipefail
        tag="$(sed -nE 's/^[[:space:]]*roc: "(nightly-[^"]+)".*/\1/p' ci/perf/bench.roc)"
        if [ -z "$tag" ]; then
          echo "::error::ci/perf/bench.roc must pin a nightly with a roc: entry in its header."
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4 # ratchet:roc-lang/setup-roc@v0.4.0
      with:
        version: nightly
        nightly-tag: ${{ steps.nightly.outputs.tag }}
        cache: 'false'
