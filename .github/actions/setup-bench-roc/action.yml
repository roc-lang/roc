name: 'Set up Roc for ci/perf/bench.roc'
description: 'Install the Roc release that the `roc:` entry in the header of ci/perf/bench.roc pins.'
runs:
  using: 'composite'
  steps:
    - name: Read the pinned Roc release
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -nE 's/^[[:space:]]*roc: "([^"]+)".*/\1/p' ci/perf/bench.roc)"
        if [ -z "$version" ] || [ "$version" = nightly ] || [[ "$version" == nightly-* ]]; then
          echo "::error::ci/perf/bench.roc must pin a Roc release with a roc: entry in its header."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Release versions are supported on setup-roc main, not yet in a tagged release.
    - uses: roc-lang/setup-roc@19c9da4f0158ca74c4ac27d8999c17b5c2739cbf # ratchet:roc-lang/setup-roc@main
      with:
        version: ${{ steps.pin.outputs.version }}
        cache: 'false'
