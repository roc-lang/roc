name: 'Set up Rust'
description: >-
  Make the pinned Rust toolchain the default, with clippy and the targets the
  RustGlue checks and tests compile for: wasm32, and on Linux the host's musl
  target.
runs:
  using: 'composite'
  steps:
    # Pinned rather than taking whatever Rust the runner image ships. Rust
    # 1.100 passes a wasm32 `#[repr(C)]` struct whose only field is a SIMD
    # vector indirectly (rust-lang/rust#162806 made `singleton_scalar` accept
    # only scalars), while clang, and so Roc, passes it as a `v128`. That breaks
    # the RustGlue wasm32 layout-probe case. Unpin once a fixed Rust ships.
    - name: Install Rust
      shell: bash
      env:
        ROC_CI_RUST: '1.99.0'
      run: |
        set -euo pipefail
        targets=wasm32-unknown-unknown
        if [ "$RUNNER_OS" = Linux ]; then
          if [ "$RUNNER_ARCH" = ARM64 ]; then
            targets="$targets,aarch64-unknown-linux-musl"
          else
            targets="$targets,x86_64-unknown-linux-musl"
          fi
        fi
        rustup toolchain install "$ROC_CI_RUST" --profile minimal --no-self-update --component clippy --target "$targets"
        rustup default "$ROC_CI_RUST"
        rustc --version
        clippy-driver --version
