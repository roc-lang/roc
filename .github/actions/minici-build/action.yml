name: 'Build MiniCI for this host'
description: >-
  Run `build-ci` once and upload its outputs as the build artifact every MiniCI
  shard of this host restores (see the `minici-shard` action), so the shards
  run the tests without compiling them again. Run after checkout.
inputs:
  jobs:
    description: 'A `-jN` limit on `build-ci` parallelism, or empty for one job per CPU'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    # `use-tool-cache` installs Zig at $RUNNER_TOOL_CACHE/zig/<version>/<arch>,
    # the same path in this build job and in every shard of its host. Without
    # it Zig lands in a random per-job directory, and Run steps that invoke
    # the zig executable (the wasm32 builtins `zig wasm-ld -r` merge) hash
    # that absolute path, so every shard would miss the restored cache and
    # rebuild everything that embeds the wasm32 builtins through eval.
    #
    # `use-cache: false`: the build outputs travel to the shards as the
    # artifact below, which holds the whole `.zig-cache` whatever its size.
    - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
      with:
        version: 0.17.1
        use-cache: false
        use-tool-cache: 'true'

    - uses: ./.github/actions/setup-rust

    - name: Cache Zig dependency packages
      uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
      with:
        # Zig stores fetched packages in the `p/` subdir of the global cache.
        # Caching just that under a stable build.zig.zon-hash key keeps deps
        # present across runs, so a cold runner does not re-download deps from
        # GitHub and hit HttpConnectionClosing.
        path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
        key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
        restore-keys: |
          zig-deps-${{ runner.os }}-${{ runner.arch }}-

    # The embedded lld-link resolves /defaultlib via the LIB env and roc's
    # linker locates the Windows SDK/MSVC libpaths at runtime (needed by
    # run-test-cli / run-test-dylib / run-test-archive inside minici).
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # ratchet:TheMrMilchmann/setup-msvc-dev@v4.0.0
      with:
        arch: x64

    # The eval runner and eval unit tests each link the embedded LLVM libraries.
    # Building the runner first keeps their large Windows link processes from
    # overlapping in build-ci, which exhausted the hosted runner's memory.
    - name: Build eval runner first (Windows)
      if: runner.os == 'Windows'
      uses: ./.github/actions/flaky-retry
      with:
        command: zig build build-test-eval-runner
        retry_count: 3

    # The remaining compilation happens here, where network flakes surface
    # on stdout for flaky-retry to match. The shards then consume the build
    # artifact and go straight to the run steps, so their failures are
    # genuine and never retried.
    # No `error_string_contains` override: this command has no flake signature
    # of its own, so it uses the action's default list.
    - name: Build MiniCI binaries
      uses: ./.github/actions/flaky-retry
      with:
        command: zig build ${{ inputs.jobs }} build-ci -Dembed-builtin-unit=true
        retry_count: 3

    # zstd on all cores, instead of upload-artifact's single-threaded zip
    # deflate, which was the bottleneck (~40-50 MB/s of input). The upload
    # below stores the already-compressed file as-is (`compression-level: 0`).
    # Streaming tar into zstd also avoids writing an uncompressed tar the size
    # of `.zig-cache` next to it. zstd is preinstalled on every runner image
    # MiniCI builds on.
    #
    # Windows runners' tar cannot recreate symlinks on extraction, and the
    # build cache holds some (a versioned shared library such as the glibc
    # test stub is emitted as `libc.so` -> `libc.so.6` -> `libc.so.6.0.0`),
    # so there the artifact stores each link's target file instead.
    #
    # `zig-pkg` is where Zig 0.17 unpacks dependencies, the LLVM libraries
    # among them. The cache records those files as link inputs, so a shard
    # needs them in place before it re-stamps the cache; left out, Zig would
    # unpack fresh copies afterwards and relink everything that uses LLVM.
    #
    # `minici-build-runner-image` names the hosted runner image this job ran
    # on. A shard compares it with its own (`--minici-build-runner-image`):
    # on another image the system headers and libraries differ, so compile
    # steps that read them miss the restored cache for a reason that is not
    # build.zig's, and MiniCI's cache-reuse canary says so instead of failing.
    - name: Pack MiniCI build artifact
      shell: bash
      run: |
        set -euo pipefail
        printf '%s/%s\n' "${ImageOS:?}" "${ImageVersion:?}" > .zig-cache/minici-build-runner-image
        if [ "$RUNNER_OS" = "Windows" ]; then
          tar --dereference -cf - .zig-cache zig-pkg zig-out/bin zig-out/lib | zstd -T0 -3 -q -o minici-build.tar.zst
        else
          tar -cf - .zig-cache zig-pkg zig-out/bin zig-out/lib | zstd -T0 -3 -q -o minici-build.tar.zst
        fi

    # Packing is the disk high-water mark of this job. Report free space and
    # the packed size here, where the peak actually is.
    - name: Report disk headroom and packed artifact size
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        set -uo pipefail
        df -h "$GITHUB_WORKSPACE" || true
        if [ -f minici-build.tar.zst ]; then
          # `wc -c` over `du`: apparent size, comparable across filesystems
          # and to the uploaded artifact size the log reports later.
          bytes="$(wc -c < minici-build.tar.zst)"
          awk -v b="$bytes" 'BEGIN { printf "minici-build.tar.zst %.1f MB (%d bytes)\n", b/1048576, b }'
        else
          echo "(no minici-build.tar.zst -- packing did not complete)"
        fi

    # Named by OS and architecture, which is unique per host within a run:
    # pull-request CI and the nightly gate never build MiniCI for the same
    # OS and architecture in one run.
    - name: Upload MiniCI build artifact
      uses: actions/upload-artifact@v7.0.1 # ratchet:actions/upload-artifact@v7.0.1
      with:
        name: minici-build-${{ runner.os }}-${{ runner.arch }}
        path: minici-build.tar.zst
        if-no-files-found: error
        retention-days: 1
        overwrite: true
        compression-level: 0
