on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.1.1
  arch: arm64

# Vault for the tool caches PACKAGES declare internally (git/clone, …), our own compile
# tasks declare none (see ci.yml for the rationale).
tool-cache:
  vault: dylan-roc

# Shared filters/agent shapes — same as ci.yml (see there for the full rationale).
aliases:
  pos-build: &pos-build
    - build.zig
    - build.zig.zon
    - src
    - test
    - "!test/snapshots" # runtime data for the snapshot tool, not a compile input — see ci.yml
    - ci
    - vendor
    - legal_details # embedded into the roc binary via addAnonymousImport (build.zig:5042)

  pos-leaf: &pos-leaf
    - build.zig
    - build.zig.zon
    - src
    - test
    - ci
    - vendor
    - legal_details
    - zig-out
    - .captain

  # Leaf inputs + data files imported by the CLI/platform test fixtures (test/fx imports
  # CONTRIBUTING/profiling/…, test/echo/all_syntax_test.roc imports the repo-root README.md).
  pos-cli: &pos-cli
    - *pos-leaf # arrays flatten, so this composes pos-leaf + the two extra entries
    - CONTRIBUTING/profiling
    - README.md

  test-agent: &test-agent # CPU-bound test leaves: CO 8c/16g
    cpus: 8
    memory: 16gb

tasks:
  - key: code
    call: git/clone 2.0.8
    with:
      repository: https://github.com/roc-lang/roc.git
      ref: ${{ init.commit-sha }}

  # Extracted into $HOME (OUTSIDE the workspace) with the local zig build cache
  # pinned to $HOME/.zig-cache, so the positive, workspace-relative input filters
  # stay pure-source without whiting out the toolchain.
  - key: zig-arm64
    run: |
      set -euo pipefail
      ZIG_VERSION=0.16.0
      ZIG_DIR="zig-aarch64-linux-${ZIG_VERSION}"
      URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_DIR}.tar.xz"
      for attempt in 1 2 3; do
        if curl -fsSL --retry 3 -o zig.tar.xz "$URL"; then break; fi
        echo "zig download attempt ${attempt} failed; retrying" >&2
        sleep 5
      done
      tar -xf zig.tar.xz -C "$HOME"
      rm zig.tar.xz
      mkdir -p "$HOME/.zig-cache"
      echo "$HOME/${ZIG_DIR}" > "$RWX_ENV/PATH"
      echo "$HOME/.zig-cache" > "$RWX_ENV/ZIG_LOCAL_CACHE_DIR"
      "$HOME/${ZIG_DIR}/zig" version

  # Fetches network dependencies for zig build
  - key: zig-deps-arm64
    use: [code, zig-arm64]
    filter: *pos-build
    run: |
      set +e
      pattern="HttpConnectionClosing|EndOfStream|503|Timeout|WriteFailed|TemporaryNameServerFailure|cannot download|ConnectionResetByPeer|ConnectionTimedOut|FetchFailed|invalid HTTP response|bad HTTP response"
      fetch_all() {
        zig build build-ci -Dfuzz -Dsystem-afl=false --fetch || return 1
        kcov_url=$(grep -A1 'kcov = ' build.zig.zon | grep -oE 'https://[^"]+')
        [ -n "$kcov_url" ] || { echo "kcov url not found in build.zig.zon" >&2; return 1; }
        echo "fetching lazy dep kcov: $kcov_url"
        zig fetch "$kcov_url" || return 1
      }
      attempt=1; max=5
      while :; do
        fetch_all 2>&1 | tee /tmp/fetch.out
        rc=${PIPESTATUS[0]}
        [ "$rc" -eq 0 ] && break
        if [ "$attempt" -ge "$max" ] || ! grep -qE "$pattern" /tmp/fetch.out; then exit "$rc"; fi
        attempt=$((attempt+1)); echo ">>> transient fetch failure; retry ${attempt}/${max} in 10s" >&2; sleep 10
      done

  # Precompile build runner
  - key: zig-build-runner-arm64
    use: [code, zig-arm64, zig-deps-arm64]
    filter:
      - build.zig
      - build.zig.zon
      - src/build
      - src/target
    agent:
      cpus: 4
      memory: 8gb
    run: |
      set -euo pipefail
      zig build --list-steps

  - key: captain
    call: rwx/install-captain 1.1.7

  - key: rust-lang
    call: rust-lang/install 1.0.7
    with:
      rust-version: 1.83.0

  - key: system-file
    run: |
      set -euo pipefail
      sudo apt-get update && sudo apt-get install -y file

  - key: system-kcov
    run: |
      set -euo pipefail
      # Authoritative build-dep list: src/flake.nix `kcovBuildDeps`
      #   = [ elfutils  pkg-config  curl  zlib ]  (Linux only).
      # elfutils -> libdw-dev + libelf-dev, curl -> libcurl4-openssl-dev,
      # zlib -> zlib1g-dev. pkg-config is essential: kcov's build resolves
      # libdw/libelf via pkg-config module names; without it Zig searches
      # "lib"+name (liblibdw.so) and fails. rwx/base ships none of these.
      sudo apt-get update && sudo apt-get install -y \
        pkg-config libdw-dev libelf-dev libcurl4-openssl-dev zlib1g-dev

  - key: build-ci-arm64
    use: [code, zig-arm64, system-kcov, zig-deps-arm64, zig-build-runner-arm64]
    filter: *pos-build
    timeout: 45m
    agent:
      cpus: 8
      memory: 32gb
    run: |
      set -euo pipefail
      zig build build-ci -Droc-test-runner -Dfuzz -Dsystem-afl=false

  - key: unit-debug
    use: [build-ci-arm64, captain]
    filter: *pos-leaf
    agent: *test-agent
    run: |
      set -euo pipefail
      captain run roc-unit-debug
    outputs:
      test-results:
        - path: tmp/captain/roc-unit-debug.json

  - key: platforms
    use: [build-ci-arm64, captain, rust-lang]
    filter: *pos-cli
    agent: *test-agent
    run: |
      set -euo pipefail
      captain run roc-cli-platforms
      ./zig-out/bin/roc check ./CONTRIBUTING/profiling/bench_repeated_check.roc
    outputs:
      test-results:
        - path: tmp/captain/roc-cli-platforms.json

  - key: coverage-parser
    use: [system-kcov, build-ci-arm64]
    filter: *pos-leaf
    agent: *test-agent
    run: |
      set -euo pipefail
      zig build run-coverage-parser

  - key: build-release-arm64
    use: [code, zig-arm64, system-kcov, zig-deps-arm64, zig-build-runner-arm64]
    filter: *pos-build
    timeout: 45m
    agent:
      cpus: 16
      memory: 64gb
    run: |
      set -euo pipefail
      zig build build-ci -Droc-test-runner -Doptimize=ReleaseFast -Dfuzz -Dsystem-afl=false

  - key: unit-release
    use: [build-release-arm64, captain]
    filter: *pos-leaf
    agent: *test-agent
    run: |
      set -euo pipefail
      captain run roc-unit-release
    outputs:
      test-results:
        - path: tmp/captain/roc-unit-release.json

  - key: lsp
    use: [build-ci-arm64, captain]
    filter: *pos-leaf
    agent: *test-agent
    run: |
      set -euo pipefail
      captain run roc-lsp
    outputs:
      test-results:
        - path: tmp/captain/roc-lsp.json

  - key: platform-tests
    use: [build-ci-arm64, captain]
    filter: *pos-cli
    agent: *test-agent
    run: |
      set -euo pipefail
      captain run roc-platforms
    outputs:
      test-results:
        - path: tmp/captain/roc-platforms.json

  - key: static-link
    use: [build-release-arm64, system-file]
    filter: *pos-leaf
    run: |
      set -euo pipefail
      file ./zig-out/bin/roc
      file ./zig-out/bin/roc | grep "statically linked"
